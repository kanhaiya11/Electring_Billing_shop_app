services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: electrical_billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
    volumes:
      - postgres_data:/var/lib/postgresql/data
  web:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
volumes:
  postgres_data:
